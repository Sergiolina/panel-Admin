<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productos — Panel Admin</title>

    <link rel="stylesheet" href="css/productos.css">
</head>

<body>

    <header class="admin-header">
        <div>
            <h1>Productos</h1>
            <p>Administra los productos del catálogo.</p>
        </div>

        <div class="acciones-header">
            <a href="index.html">Panel</a>
            <button id="cerrarSesion">Cerrar sesión</button>
        </div>
    </header>

    <main class="productos-container">

        <div class="barra-productos">
            <h2>Catálogo</h2>

            <button id="nuevoProducto">
                + Nuevo producto
            </button>
        </div>

        <p id="mensaje"></p>

<section id="formularioProducto" class="formulario-producto" hidden>

    <div class="formulario-header">
 
       <<h2 id="tituloFormulario">Nuevo producto</h2>

         <button type="button" id="cancelarProducto">
            Cancelar
        </button>
    </div>

    <form id="productoForm">

        <div>
            <label for="nombre">Nombre</label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                required>
        </div>

        <div>
            <label for="precio">Precio</label>

            <input
                type="number"
                id="precio"
                name="precio"
                min="0"
                step="0.01"
                required>
        </div>

        <div>
            <label for="descripcion">Descripción</label>

            <textarea
                id="descripcion"
                name="descripcion"
                rows="4"></textarea>
        </div>

        <div>
            <label for="categoria">Categoría</label>

            <input
                type="text"
                id="categoria"
                name="categoria">
        </div>

        <div>
            <label for="imagenUrl">URL de la imagen</label>

            <input
                type="url"
                id="imagenUrl"
                name="imagenUrl"
                placeholder="https://...">
        </div>

        <div>
            <label for="disponible">
                <input
                    type="checkbox"
                    id="disponible"
                    name="disponible"
                    checked>

                Producto disponible
            </label>
        </div>

        <button type="submit" id="guardarProducto">
    Guardar producto
      </button>

    </form>

</section>

<section id="listaProductos" class="lista-productos">
    <!-- Los productos se cargarán desde la API -->
</section>

    </main>

    <script src="js/productos.js"></script>

</body>
</html>
